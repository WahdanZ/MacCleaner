# Publishes website/ to GitHub Pages (https://wahdanz.github.io/MacCleaner/).
# The page shows the latest released version: it is written into the HTML here, at build time,
# from the newest v* tag, so the page needs no JavaScript or GitHub API calls.
# One-time setup: Settings › Pages › Build and deployment › Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
    paths: ["website/**", "docs/screenshots/**", ".github/workflows/pages.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # tags, for the version number

      - name: Assemble the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/build-site.sh _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
