# Publishes website/ to GitHub Pages (https://wahdanz.github.io/MacCleaner/).
# The page shows the latest released version: it is written into the HTML here, at build time,
# from the newest v* tag, so the page needs no JavaScript or GitHub API calls.
# One-time setup: Settings › Pages › Build and deployment › Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
    paths: ["website/**", "docs/screenshots/**", ".github/workflows/pages.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # tags, for the version number

      - name: Assemble the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/build-site.sh _site

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
