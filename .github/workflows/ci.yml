name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: CI only builds and tests.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, self-test, CLI check
    runs-on: macos-15
    timeout-minutes: 30
    env:
      APP: build/Release/Mac Cleaner.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Core tests (Swift 6 package)
        run: swift test --package-path Packages/MacCleanerKit

      # Finds unexpected places that could issue a cleanup approval; the self-test checks the confirmation itself.
      - name: Approval call sites
        run: scripts/check-approval-sites.sh

      # A fresh checkout: nothing built or resolved before this step (the check below proves it).
      - name: Build (Release, ad-hoc signed, from a clean checkout)
        run: |
          test ! -e build && test ! -e Packages/MacCleanerKit/build || { echo "::error::build output already present"; exit 1; }
          scripts/xcbuild.sh CODE_SIGN_IDENTITY=-
          test -x "$APP/Contents/MacOS/Mac Cleaner"
          N=$(nm -U "$APP/Contents/MacOS/Mac Cleaner" | grep -c MacCleanerCore || true); [ "$N" -gt 0 ] || { echo "::error::MacCleanerCore is not linked into the app"; exit 1; }; echo "MacCleanerCore linked ($N symbols)"

      - name: Safety self-test (throwaway home folder)
        run: scripts/selftest.sh "$APP"

      - name: Command line check (read-only commands)
        run: |
          set -e
          BIN="$APP/Contents/MacOS/Mac Cleaner"
          "$BIN" --cli help > /dev/null
          "$BIN" --cli status --json | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["free_bytes"] > 0; print("status ok")'
          "$BIN" --cli tools | grep -q disk_status
          # A delete command without --yes and without a keyboard must change nothing and exit 2.
          echo hi > "$HOME/ci-keep.txt"
          set +e; "$BIN" --cli trash-files "$HOME/ci-keep.txt" < /dev/null; code=$?; set -e
          test "$code" = 2 && test -f "$HOME/ci-keep.txt" && echo "preview-only ok"

      - name: MCP server check
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | "$APP/Contents/MacOS/Mac Cleaner" --mcp \
            | python3 -c 'import json,sys; r=[json.loads(l) for l in sys.stdin]; n=len(r[1]["result"]["tools"]); print(n, "tools"); assert n >= 21'

      # Release checks that need no credentials: hardened runtime, exact entitlements, bundle ID, version,
      # deep code signature, checksum. Developer ID, notarization and Gatekeeper need the release secrets
      # and are checked by the Release workflow and scripts/sign-release.sh.
      - name: Release verification (dev mode, no credentials)
        run: |
          V=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          scripts/make-dmg.sh "$APP" "build/MacCleaner-$V.dmg"
          (cd build && shasum -a 256 "MacCleaner-$V.dmg" > "MacCleaner-$V.dmg.sha256")
          scripts/verify-release.sh "build/MacCleaner-$V.dmg" --version "$V" --dev --no-sig

      - name: Package app
        run: ditto -c -k --keepParent "$APP" MacCleaner-unsigned.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MacCleaner-unsigned
          path: MacCleaner-unsigned.zip
          retention-days: 14
